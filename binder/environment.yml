# Binder environment configuration for Forge notebooks
# https://mybinder.readthedocs.io/en/latest/using/config_files.html

name: forge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyter
  - pip:
    - forge-features[all]
