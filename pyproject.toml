[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-features"
version = "0.1.0"
description = "Automated feature engineering platform for machine learning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Forge Team", email = "team@forge.dev" }
]
keywords = [
    "feature-engineering",
    "machine-learning",
    "data-science",
    "scikit-learn",
    "automated-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "typing_extensions>=4.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
shap = ["shap>=0.42.0"]
boosting = ["xgboost>=2.0.0", "lightgbm>=4.0.0"]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
feast = ["feast>=0.49.0"]
dashboard = ["streamlit>=1.30.0"]
catalog-api = ["fastapi>=0.100.0", "uvicorn>=0.25.0"]
dask = ["dask[distributed]>=2024.1.0"]
ray = ["ray>=2.9.0"]
spark = ["pyspark>=3.5.0"]
gpu = ["cudf-cu12>=24.2.0", "cupy-cuda12x>=13.0.0"]
neural = ["torch>=2.0.0"]
serving = ["fastapi>=0.100.0", "uvicorn>=0.25.0"]
# Recommended extras for most users (viz + boosting + SHAP, no LLM/distributed)
recommended = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.42.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
all = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.42.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "feast>=0.49.0",
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "dask[distributed]>=2024.1.0",
    "ray>=2.9.0",
    "pyspark>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/forge-features/forge"
Documentation = "https://forge.dev/docs"
Repository = "https://github.com/forge-features/forge"
Issues = "https://github.com/forge-features/forge/issues"
Changelog = "https://github.com/forge-features/forge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]
include = ["src/forge/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "TCH",    # flake8-type-checking
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "D100",    # missing docstring in public module
    "D102",    # missing docstring in public method (many are self-explanatory)
    "D104",    # missing docstring in public package
    "D105",    # missing docstring in magic method
    "D107",    # missing docstring in __init__
    "N803",    # argument name should be lowercase (sklearn uses X, y by convention)
    "N806",    # variable name should be lowercase (sklearn uses X, y by convention)
    "S101",    # use of assert (OK in tests)
    "B904",    # raise from within except (too noisy for existing codebase)
    "RUF012",  # mutable class variables (common pattern in dataclasses)
    "SIM108",  # ternary operator (readability preference)
    "S110",    # try-except-pass (intentional in many cases)
    "RUF001",  # ambiguous unicode (intentional use of × etc.)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "B018", "PT011", "B017"]  # Allow asserts, skip docstrings, broad exception checks
"benchmarks/**/*.py" = ["S101", "D"]  # Same for benchmarks

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/forge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
